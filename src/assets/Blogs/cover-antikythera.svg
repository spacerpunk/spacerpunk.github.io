<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Antikythera mechanism cover">
  <defs>
    <linearGradient id="k-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0a08"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="k-glow" cx="42%" cy="50%" r="55%">
      <stop offset="0" stop-color="#d92906" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#d92906" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#k-bg)"/>
  <rect width="1600" height="900" fill="url(#k-glow)"/>

  <!-- gear helper drawn as many teeth via rotated rects around a ring -->
  <g stroke="#f5f5f4" stroke-opacity="0.8" fill="none" stroke-width="2.5">
    <!-- big gear -->
    <circle cx="620" cy="450" r="230"/>
    <circle cx="620" cy="450" r="200"/>
    <circle cx="620" cy="450" r="40"/>
  </g>
  <g fill="#f5f5f4" fill-opacity="0.8">
    <!-- teeth big gear -->
    <g transform="translate(620 450)">
      <g id="tooth-big">
        <rect x="-8" y="-244" width="16" height="24"/>
      </g>
    </g>
  </g>
  <!-- spokes big -->
  <g stroke="#ffffff" stroke-opacity="0.25" stroke-width="2">
    <line x1="620" y1="410" x2="620" y2="250"/>
    <line x1="620" y1="490" x2="620" y2="650"/>
    <line x1="580" y1="450" x2="420" y2="450"/>
    <line x1="660" y1="450" x2="820" y2="450"/>
  </g>

  <!-- medium gear -->
  <g stroke="#d92906" stroke-opacity="0.9" fill="none" stroke-width="2.5">
    <circle cx="1030" cy="330" r="150"/>
    <circle cx="1030" cy="330" r="125"/>
    <circle cx="1030" cy="330" r="28"/>
  </g>
  <g stroke="#d92906" stroke-opacity="0.3" stroke-width="2">
    <line x1="1030" y1="300" x2="1030" y2="200"/>
    <line x1="1030" y1="360" x2="1030" y2="460"/>
    <line x1="1000" y1="330" x2="900" y2="330"/>
    <line x1="1060" y1="330" x2="1160" y2="330"/>
  </g>

  <!-- small gear -->
  <g stroke="#f5f5f4" stroke-opacity="0.6" fill="none" stroke-width="2">
    <circle cx="1120" cy="620" r="95"/>
    <circle cx="1120" cy="620" r="76"/>
    <circle cx="1120" cy="620" r="18"/>
  </g>

  <!-- teeth (dashed rings approximate gear teeth) -->
  <g fill="none" stroke="#f5f5f4" stroke-opacity="0.55">
    <circle cx="620" cy="450" r="230" stroke-width="20" stroke-dasharray="10 20"/>
  </g>
  <g fill="none" stroke="#d92906" stroke-opacity="0.6">
    <circle cx="1030" cy="330" r="150" stroke-width="16" stroke-dasharray="9 17"/>
  </g>
  <g fill="none" stroke="#f5f5f4" stroke-opacity="0.4">
    <circle cx="1120" cy="620" r="95" stroke-width="12" stroke-dasharray="7 13"/>
  </g>

  <text x="80" y="820" font-family="'JetBrains Mono', monospace" font-size="26" letter-spacing="8" fill="#d92906">THE · ANTIKYTHERA · SIGNAL</text>
  <text x="80" y="120" font-family="'JetBrains Mono', monospace" font-size="18" letter-spacing="6" fill="#78716c">VISUAL ESSAY // 002</text>
</svg>
